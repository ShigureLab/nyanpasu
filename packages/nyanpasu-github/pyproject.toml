[project]
name = "nyanpasu-github"
version = "0.1.0"
description = "Shared GitHub helpers for Nyanpasu plugins."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "loguru>=0.7.3",
  "nyanpasu",
  "pydantic>=2.12.0",
]
authors = [{ name = "Nyakku Shigure", email = "sigure.qaq@gmail.com" }]
license = "MIT"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
