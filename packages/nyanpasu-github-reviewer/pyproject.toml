[project]
name = "nyanpasu-github-reviewer"
version = "0.1.0"
description = "GitHub pull request review plugin for Nyanpasu."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.12.0",
  "fastapi>=0.125.0",
  "loguru>=0.7.3",
  "nyanpasu",
  "pydantic>=2.12.0",
  "typer>=0.20.0",
]
authors = [{ name = "Nyakku Shigure", email = "sigure.qaq@gmail.com" }]
license = "MIT"

[project.entry-points."nyanpasu.plugins"]
github_reviewer = "nyanpasu_github_reviewer:plugin"

[project.scripts]
nyanpasu-github-reviewer = "nyanpasu_github_reviewer.__main__:app"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
