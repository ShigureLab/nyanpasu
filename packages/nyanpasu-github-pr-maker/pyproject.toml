[project]
name = "nyanpasu-github-pr-maker"
version = "0.1.0"
description = "GitHub pull request creation plugin for Nyanpasu."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.125.0",
  "loguru>=0.7.3",
  "nyanpasu",
  "nyanpasu-github",
  "pydantic>=2.12.0",
]
authors = [{ name = "Nyakku Shigure", email = "sigure.qaq@gmail.com" }]
license = "MIT"

[project.entry-points."nyanpasu.plugins"]
github_pr_maker = "nyanpasu_github_pr_maker:plugin"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
