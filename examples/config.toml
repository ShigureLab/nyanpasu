[server]
host = "127.0.0.1"
port = 8765
# Set a random bearer token before exposing the service beyond localhost.
# token = "replace-with-a-random-token"
# NYANPASU__SERVER__TOKEN overrides this value; omitting both keeps authentication disabled.

# A backend name identifies one worker process configuration. Multiple names may
# share the same driver and use different credentials, profiles, or defaults.
[backends.codex]
driver = "codex"

[backends.codex.process]
command = ["codex"]
pass_env = ["NYANPASU_GITHUB_TOKEN"]

[backends.codex.home]
native_directory = ".codex"
# Optional minimal HOME tree with config/auth/skills, never a personal HOME.
# template = "/opt/nyanpasu-home-templates/codex"

[backends.codex.defaults]
# model = "your-codex-model"
# reasoning = "high"

[backends.codex.options]
sandbox = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
rpc_timeout_seconds = 60

[backends.claude]
driver = "claude-code"

[backends.claude.process]
command = ["claude", "--permission-prompts", "none", "--system-prompt-snapshot", "off"]
pass_env = ["ANTHROPIC_API_KEY", "NYANPASU_GITHUB_TOKEN"]

[backends.claude.home]
native_directory = ".claude"
# Wrappers may require another relative native path and matching template layout.
# template = "/opt/nyanpasu-home-templates/claude"

[backends.claude.defaults]
# model = "your-claude-model"
# reasoning = "high"

[backends.claude.options]
permission_mode = "auto"
allowed_tools = ["Read", "Grep", "Glob", "Bash(gh *)", "Bash(git diff *)"]
# Optional Claude-native generation and auto-review fallback chain.
# fallback_models = [{ model = "sonnet", reasoning = "medium" }, "haiku"]

[tasks.defaults.execution]
backend = "codex"

[tasks.defaults.limits]
turn_timeout_seconds = 3600

# Each kind resolves backend/model/reasoning independently at admission.
# Requests may override these fields; already queued work keeps its target.
[tasks.kinds."github_reviewer.review".execution]
backend = "claude"
# model = "your-review-model"
# reasoning = "high"

[tasks.kinds."github_reviewer.independent-design".execution]
backend = "codex"
# This child always has shared memory disabled.

# CI analysis is a bounded log-reading child; the parent review model is unchanged.
# This model alias requires a Claude-compatible provider configured to serve it.
[tasks.kinds."github_reviewer.ci-analysis".execution]
backend = "claude"
model = "deepseek-v4.1-flash-ali"
reasoning = "xhigh"

[tasks.kinds."github_pr_maker.create".execution]
backend = "codex"

[tasks.kinds."github_pr_maker.followup".execution]
backend = "codex"

# Both background stages are queued tasks within the source's contribution audience.
# Background memory has model credentials only, without reviewer GitHub tokens.
[backends.memory]
driver = "codex"

[backends.memory.process]
command = ["codex", "-c", "features.multi_agent=false"]

[backends.memory.defaults]
model = "gpt-6-luna"
reasoning = "medium"

[backends.memory.options]
sandbox = "read-only"
approval_policy = "never"

[tasks.kinds.memory_extraction.execution]
backend = "memory"

[tasks.kinds.memory_extraction.limits]
turn_timeout_seconds = 900

[tasks.kinds.memory_consolidation.execution]
backend = "memory"

[tasks.kinds.memory_consolidation.limits]
turn_timeout_seconds = 900

[memory]
enabled = true
consolidate = true
max_results_per_search = 10 # Default and maximum result count (1-100).
# Memory is stored below NYANPASU_HOME/memory and shared across backend drivers.
# Native Codex and Claude auto-memory is disabled only for Nyanpasu subprocesses.

[runtime]
concurrency = 4
coalesce_window_seconds = 600
clean_event_snapshots = true

[plugins]
enabled = ["github_reviewer", "github_pr_maker"]

[integrations.github]
token_env = "NYANPASU_GITHUB_TOKEN"
git_author_name = "Nyanpasu"
git_author_email = "nyanpasu@example.invalid"

[plugins.settings.github_reviewer]
agent_name = "Nyanpasu"
github_login = "your-github-login"
review_language = "Chinese"
poll_enabled = true
poll_interval_seconds = 600
ci_poll_interval_seconds = 120 # Independent CI observation; 0 disables CI polling.
poll_event_pages = 3
poll_max_events_per_cycle = 0
dry_run = false
post_reviews = true

[[plugins.settings.github_reviewer.instruction_docs]]
name = "SOUL.md"
path = "/path/to/SOUL.md"

[plugins.settings.github_reviewer.repos."owner/repo"]
local_path = "/path/to/repo"
github_remote = "https://github.com/owner/repo.git"
base_branches = ["main"]
# Default access reads public + shared:github:owner/repo, writes only that shared
# audience. Set memory = { read_domains = [] } here to disable memory for this repo.
# Non-public audiences require server.token; see README.md#background-memory for access rules.

[[plugins.settings.github_reviewer.repos."owner/repo".instruction_docs]]
name = "AGENTS.md"
path = "/path/to/repo/AGENTS.md"
required = false

[plugins.settings.github_pr_maker]
branch_prefix = "nyanpasu"
default_base_branch = "main"
dry_run = true
draft = false
follow_up_enabled = true
follow_up_interval_seconds = 600

[plugins.settings.github_pr_maker.repos."owner/repo"]
local_path = "/path/to/repo"
github_remote = "https://github.com/owner/repo.git"
base_branches = ["main"]
