[project]
name = "nyanpasu"
version = "0.1.0"
description = "A plugin-oriented Codex-powered agent service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.12.0",
  "fastapi>=0.125.0",
  "loguru>=0.7.3",
  "pydantic>=2.12.0",
  "typer>=0.20.0",
  "uvicorn>=0.38.0",
]
authors = [{ name = "Nyakku Shigure", email = "sigure.qaq@gmail.com" }]
keywords = []
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Operating System :: OS Independent",
  "Typing :: Typed",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/ShigureLab/nyanpasu"
Documentation = "https://github.com/ShigureLab/nyanpasu"
Repository = "https://github.com/ShigureLab/nyanpasu"
Issues = "https://github.com/ShigureLab/nyanpasu/issues"

[project.scripts]
nyanpasu = "nyanpasu.__main__:app"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "nyanpasu-github",
  "nyanpasu-github-pr-maker",
  "nyanpasu-github-reviewer",
  "ty>=0.0.72",
  "ruff>=0.16.3",
  "pytest>=9.1.1",
  "pytest-rerunfailures>=16.6",
]

[tool.uv.workspace]
members = [
  "packages/nyanpasu-github",
  "packages/nyanpasu-github-pr-maker",
  "packages/nyanpasu-github-reviewer",
]

[tool.uv.sources]
nyanpasu = { workspace = true }
nyanpasu-github = { workspace = true }
nyanpasu-github-pr-maker = { workspace = true }
nyanpasu-github-reviewer = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  # Pyflakes
  "F",
  # Pycodestyle
  "E",
  "W",
  # Isort
  "I",
  # Comprehensions
  "C4",
  # Debugger
  "T100",
  # Pyupgrade
  "UP",
  # Flake8-pyi
  "PYI",
  # Bugbear
  "B",
  # Pylint
  "PLE",
  # Flake8-simplify
  "SIM101",
  # Flake8-use-pathlib
  "PTH",
  # Pygrep-hooks
  "PGH004",
  # Flake8-type-checking
  "TC",
  # Flake8-raise
  "RSE",
  # Refurb
  "FURB",
  # Flake8-future-annotations
  "FA",
  # Yesqa
  "RUF100",
]
ignore = [
  "E501", # line too long, duplicate with ruff fmt
]
future-annotations = true

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
known-first-party = ["nyanpasu", "nyanpasu_github_reviewer"]
combine-as-imports = true

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["typing.runtime_checkable", "runtime_checkable"]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
