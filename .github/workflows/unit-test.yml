name: Unit Test

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Python dependencies
        run: uv sync --locked --all-extras --dev --python 3.14

      - name: Check, test, and build Dashboard
        run: |
          pnpm run types
          pnpm run check
          pnpm run test
          pnpm run build
          git diff --exit-code

      - name: Check browser interactions
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test

  unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15', '3.15t']
        architecture: ['x64']
    name: unittest - Python ${{ matrix.python-version }} on ${{ matrix.architecture }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          allow-prereleases: true

      - name: Install just
        uses: extractions/setup-just@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          just ci-install

      - name: Verify Python runtime
        run: |
          uv run --locked python - <<'PY'
          import os
          import sys
          import sysconfig

          import nyanpasu.__main__
          import nyanpasu_github
          import nyanpasu_github_pr_maker
          import nyanpasu_github_reviewer

          expected = os.environ["UV_PYTHON"]
          assert sys.version_info[:2] == tuple(map(int, expected.rstrip("t").split(".")))
          free_threaded = expected.endswith("t")
          assert bool(sysconfig.get_config_var("Py_GIL_DISABLED")) == free_threaded
          if free_threaded:
              assert not sys._is_gil_enabled(), "Dependencies must not re-enable the GIL"
          print(sys.version)
          PY

      - name: unit test
        run: |
          just ci-test
